name: Run Job Alert Tracker

on:
  schedule:
    # Offset off the hour on purpose. '*/25' fires at :00/:25/:50, and :00 is
    # the most congested minute on GitHub Actions -- scheduled runs are
    # delayed or silently dropped under load, worst for private free-tier
    # repos. Same 25-minute spacing, shifted clear of the rush.
    - cron: '7,32,57 * * * *'
  workflow_dispatch:        # Allows manual run from GitHub UI

concurrency:
  group: job-tracker
  cancel-in-progress: false

jobs:
  track-and-alert:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Execute Tracker Script
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          JOB_LOCATION: "Germany"
        run: |
          python src/main.py

      - name: Commit and push updated seen state
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add data/seen_jobs.json
          git diff-index --quiet HEAD || git commit -m "chore(cache): update seen jobs state [skip ci]"
          git push
