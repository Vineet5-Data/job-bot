name: Run Job Alert Tracker

on:
  # Schedule disabled 2026-08-27: the tracker now runs from cron on the Azure
  # VM every 25 minutes. GitHub only fired ~20% of scheduled runs (29 of ~144
  # over 2.5 days, gaps up to 11.5h). Leaving both enabled would double-alert,
  # because the VM keeps its own data/seen_jobs.json and the two states diverge.
  # Manual dispatch is kept as a fallback if the VM is ever down.
  # schedule:
  #   - cron: '7,32,57 * * * *'
  workflow_dispatch:        # Allows manual run from GitHub UI

concurrency:
  group: job-tracker
  cancel-in-progress: false

jobs:
  track-and-alert:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Execute Tracker Script
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          JOB_LOCATION: "Germany"
        run: |
          python src/main.py

      - name: Commit and push updated seen state
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add data/seen_jobs.json
          git diff-index --quiet HEAD || git commit -m "chore(cache): update seen jobs state [skip ci]"
          git push
